<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4BC" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8941F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#goldGradient)" stroke="#FFF8E7" stroke-width="2.5" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#5C0015" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.6" />

  <!-- CT Monogram Text -->
  <text 
    x="50" 
    y="61" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="34" 
    font-weight="800" 
    fill="#2C1810" 
    text-anchor="middle"
    filter="url(#shadow)"
    letter-spacing="-1"
  >CT</text>
</svg>
